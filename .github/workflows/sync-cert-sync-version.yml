name: Sync cert-sync version

on:
  schedule:
    - cron: "54 5 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Compare upstream VERSION to cert_sync/config.yaml
        id: check
        run: |
          upstream=$(curl -fsSL https://raw.githubusercontent.com/foxey/cert-sync/main/VERSION | tr -d '[:space:]')
          current=$(grep '^version:' cert_sync/config.yaml | sed -E 's/version: *"([^"]+)"/\1/')
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$upstream" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.changed == 'true'

      - name: Verify cert-sync published the matching image
        id: verify
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM: ${{ steps.check.outputs.upstream }}
        run: |
          # The version bump should only ship once the multi-arch manifest
          # for it actually exists in ghcr.io, otherwise Supervisor would
          # point at a tag with no image yet.
          if docker buildx imagetools inspect "ghcr.io/foxey/cert-sync-homeassistant:${UPSTREAM}" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Image ghcr.io/foxey/cert-sync-homeassistant:${UPSTREAM} not published yet; will retry on the next run."
          fi

      - name: Open and merge version bump PR
        if: steps.check.outputs.changed == 'true' && steps.verify.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.check.outputs.upstream }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          branch="sync-cert-sync-version-$UPSTREAM"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i -E "s/^version: \"[^\"]+\"/version: \"$UPSTREAM\"/" cert_sync/config.yaml
          curl -fsSL https://raw.githubusercontent.com/foxey/cert-sync/main/home-assistant-app/CHANGELOG.md -o cert_sync/CHANGELOG.md
          git add cert_sync/config.yaml cert_sync/CHANGELOG.md
          git commit -m "Sync cert_sync version to $UPSTREAM" \
            -m "cert-sync's published image moved to $UPSTREAM (was $CURRENT). Bumping here so Supervisor detects the update, and syncing CHANGELOG.md from upstream." \
            -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$branch"
          body=$(printf '%s\n\n%s' "cert-sync published a new image version (${UPSTREAM}, was ${CURRENT}). This bumps cert_sync/config.yaml's version field so Home Assistant Supervisor detects the update, and syncs cert_sync/CHANGELOG.md from upstream. The sync-cert-sync-version workflow verified the matching ghcr.io image exists before opening this PR." "Opened and merged automatically by the daily version-sync check.")
          gh pr create \
            --title "Sync cert_sync version to ${UPSTREAM}" \
            --body "$body" \
            --base main \
            --head "$branch"
          gh pr merge "$branch" --squash --delete-branch
